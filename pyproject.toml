[project]
name = "drawing-to-solidworks"
version = "1.0.0"
description = "Upload an engineering drawing, get a SolidWorks part (SLDPRT, STEP, STL and a preview)."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0,<3",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "ezdxf>=1.4,<2",
    "pydantic>=2",
    "numpy",
    "matplotlib",
    "google-genai",
    "pywin32",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
]
