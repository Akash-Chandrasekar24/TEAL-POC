[project]
name = "drawing-to-solidworks"
version = "1.0.0"
description = "Upload an engineering drawing, get a SolidWorks part (SLDPRT, STEP, STL and a preview)."
requires-python = ">=3.12"
dynamic = ["dependencies"]

# requirements.txt is the ONE list of (pinned) dependencies
[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
